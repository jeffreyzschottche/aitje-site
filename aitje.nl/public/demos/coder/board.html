<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orbit — projectboard</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f5ef;
        color: #253024;
        font:
          12px system-ui,
          sans-serif;
        padding: 25px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #d9dfd0;
        padding-bottom: 17px;
      }
      .brand {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 750;
        font-size: 19px;
        letter-spacing: -1px;
      }
      .logo {
        font-size: 22px;
        color: #8c9e56;
      }
      small {
        font: 9px monospace;
        color: #7b886e;
        letter-spacing: 1px;
      }
      .avatar {
        border-radius: 50%;
        background: #dfc889;
        color: #62562e;
        font-size: 10px;
        padding: 8px;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -1px;
        margin: 25px 0 6px;
      }
      .intro {
        color: #7c8871;
        margin: 0;
      }
      .summary {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        padding: 15px 0;
        color: #7b886f;
        border-block: 1px solid #d9dfd0;
        font-size: 10px;
      }
      .summary strong {
        color: #35452d;
        font-size: 17px;
        margin-right: 5px;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        margin: 20px 0 17px;
        align-items: center;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex: 1 1 240px;
        min-width: 0;
      }
      input,
      select {
        min-height: 44px;
        font: 11px system-ui;
        border: 1px solid #cfd8c3;
        border-radius: 7px;
        padding: 9px;
        background: #fff;
        color: #425237;
        min-width: 0;
      }
      input {
        width: 170px;
        flex: 1 1 140px;
      }
      select {
        width: 105px;
        flex-shrink: 0;
      }
      #total {
        font: 9px monospace;
        color: #7a896b;
        white-space: nowrap;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .column {
        border: 1px solid #dbe0d2;
        background: #eeefe6;
        border-radius: 10px;
        padding: 11px;
        min-width: 0;
      }
      .column h2 {
        display: flex;
        justify-content: space-between;
        margin: 1px 0 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .count {
        font: 9px monospace;
        background: #dfe5d4;
        border-radius: 3px;
        padding: 2px 5px;
      }
      .card {
        padding: 12px;
        background: #fff;
        border: 1px solid #dce2d4;
        border-radius: 7px;
        margin-top: 8px;
        box-shadow: 0 3px 8px #33402204;
      }
      .meta,
      .footer {
        display: flex;
        gap: 5px;
        align-items: center;
        justify-content: space-between;
      }
      .tag {
        font-size: 8px;
        background: #f0f2e7;
        color: #7a8c58;
        border-radius: 3px;
        padding: 3px 5px;
      }
      .priority {
        font: 7px monospace;
        color: #9ba38e;
      }
      .priority.high {
        color: #a27534;
      }
      .card h3 {
        font-size: 12px;
        line-height: 1.5;
        margin: 10px 0 15px;
        font-weight: 550;
      }
      .task-id {
        font: 8px monospace;
        color: #a1ab97;
      }
      .move {
        min-height: 44px;
        font: 8px system-ui;
        color: #6b8148;
        background: #f1f5e9;
        border: 1px solid #dce5cf;
        border-radius: 4px;
        padding: 5px;
        cursor: pointer;
      }
      .move:hover {
        background: #e2ebd3;
      }
      .empty {
        font-size: 10px;
        color: #9aa58d;
        padding: 15px 0;
      }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid #78964c;
        outline-offset: 2px;
      }
      #notice {
        font-size: 10px;
        min-height: 17px;
        color: #788c58;
        margin-top: 15px;
      }
      @media (max-width: 400px) {
        body {
          padding: 18px;
        }
        input {
          width: 150px;
        }
        select {
          width: 95px;
        }
        #board {
          gap: 9px;
        }
        .column {
          padding: 8px;
        }
        .card {
          padding: 9px;
        }
        .card h3 {
          font-size: 11px;
        }
        .footer {
          flex-wrap: wrap;
        }
      }
      @media (max-width: 360px) {
        #board {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">◉</span>orbit<span
          style="
            font-weight: 400;
            color: #a6af9b;
            margin-left: 7px;
            font-size: 12px;
          "
          >/ teamspace</span
        >
      </div>
      <span class="avatar">JD</span>
    </header>
    <small style="display: block; margin-top: 23px"
      >PRODUCT DEVELOPMENT / SPRINT 04</small
    >
    <h1>Van idee naar gereed.</h1>
    <p class="intro">Een klein projectboard dat gewoon werkt.</p>
    <div class="summary">
      <span><strong>5</strong>taken</span
      ><span><strong>3</strong>disciplines</span
      ><span><strong id="done">1</strong>gereed</span>
    </div>
    <div class="tools">
      <div class="filters">
        <input
          id="search"
          aria-label="Zoek taken"
          placeholder="Zoek een taak…"
        /><select id="team" aria-label="Filter op team">
          <option value="">Alle teams</option>
          <option>Frontend</option>
          <option>Backend</option>
          <option>Design</option>
        </select>
      </div>
      <span id="total"></span>
    </div>
    <div id="board"></div>
    <p id="notice" role="status"></p>
    <script type="module" src="./board.js"></script>
  </body>
</html>
